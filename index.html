    .neg { color: var(--red); }

    .click-diff-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }

    .app-list { display: flex; flex-direction: column; gap: 6px; }

    .app-name { font-size: 12px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 8px; }

function card(cls, accentColor) {
  var e = document.createElement('div');
  e.className = 'card' + (cls ? ' ' + cls : '');
  if (accentColor) e.style.setProperty('--card-accent', accentColor);
  return e;
}

function section(label) {
  var e = document.createElement('div');
  e.className = 'section';
  e.innerHTML = '<div class="section-line"></div><div class="section-label">' + label + '</div><div class="section-line"></div>';
