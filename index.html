<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APPID 数据看板</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3e;
      --accent: #4f8ef7;
      --accent2: #6ee7b7;
      --danger: #f87171;
      --text: #e2e8f0;
      --muted: #8892a4;
      --success: #34d399;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }

    /* ── Header ── */
    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
    .header .badge { background: #1e3a5f; color: var(--accent); padding: 2px 10px; border-radius: 20px; font-size: 11px; }

    /* ── Layout ── */
    .container { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }

    /* ── Filter Row ── */
    .filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label { font-size: 11px; color: var(--muted); }
    input[type="date"], select, input[type="text"] {
      background: #0f1117; border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none;
    }
    input[type="date"]:focus, select:focus, input[type="text"]:focus { border-color: var(--accent); }
    .quick-btns { display: flex; gap: 6px; }
    .quick-btn {
      background: #1e2535; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .15s;
    }
    .quick-btn:hover, .quick-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Multiselect ── */
    .multiselect-wrap { position: relative; }
    .multiselect-trigger {
      background: #0f1117; border: 1px solid var(--border); color: var(--text);
      padding: 7px 32px 7px 10px; border-radius: 6px; cursor: pointer; min-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px;
    }
    .multiselect-trigger::after { content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .multiselect-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 100;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      min-width: 220px; max-height: 260px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .multiselect-dropdown.open { display: block; }
    .multiselect-item { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .multiselect-item:hover { background: #1e2535; }
    .multiselect-item input[type="checkbox"] { accent-color: var(--accent); }

    /* ── Buttons ── */
    .btn { padding: 8px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3a7de8; }
    .btn-primary:disabled { background: #2a3a5a; color: var(--muted); cursor: not-allowed; }
    .btn-secondary { background: #1e2535; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Pull Section ── */
    .pull-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .pull-input { width: 320px; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; padding-bottom: 2px; }
    .checkbox-wrap input { accent-color: var(--accent); width: 15px; height: 15px; }
    .checkbox-wrap label { color: var(--text); cursor: pointer; }

    /* ── Status Bar ── */
    .status-bar { padding: 10px 14px; border-radius: 7px; font-size: 12px; margin-top: 12px; display: none; }
    .status-bar.running { display: block; background: #1e3a5f; color: var(--accent); border: 1px solid #2a4a7f; }
    .status-bar.success { display: block; background: #0d2a1f; color: var(--success); border: 1px solid #1a4a35; }
    .status-bar.error { display: block; background: #2a1010; color: var(--danger); border: 1px solid #4a2020; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
    .tab {
      padding: 8px 16px; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 13px;
      color: var(--muted); border: 1px solid transparent; border-bottom: none; margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--card); color: var(--accent); border-color: var(--border); border-bottom-color: var(--card); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      background: #0f1117; color: var(--muted); font-weight: 600; text-align: right;
      padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
      text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px;
    }
    thead th:first-child { text-align: left; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:hover { background: #1e2535; }
    tbody td { padding: 9px 12px; text-align: right; color: var(--text); white-space: nowrap; }
    tbody td:first-child { text-align: left; font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .rate-cell { color: var(--accent2); }
    .revenue-cell { color: var(--warning); font-weight: 600; }
    .reject-cell { color: var(--danger); }
    .dash { color: var(--muted); }
    .loading-row td { text-align: center; color: var(--muted); padding: 40px; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .filter-row, .pull-row { flex-direction: column; }
      .pull-input { width: 100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>APPID 数据看板</h1>
  <span class="badge">UTC+0</span>
  <span id="last-update" style="margin-left:auto;color:var(--muted);font-size:11px;"></span>
  <button class="btn btn-secondary" onclick="showApiConfig()" style="font-size:11px;padding:5px 10px;margin-left:12px">⚙ API 地址</button>
</div>

<!-- API 地址配置弹窗 -->
<div id="api-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:90vw">
    <div style="font-size:15px;font-weight:700;margin-bottom:16px">⚙ 后端 API 地址配置</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">填入 ngrok 公网 HTTPS 地址，用于 GitHub Pages 访问本地后端</div>
    <input type="text" id="api-base-input" style="width:100%;margin-bottom:12px" placeholder="https://xxxx.ngrok-free.app" />
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeApiConfig()">取消</button>
      <button class="btn btn-primary" onclick="saveApiConfig()">保存并刷新</button>
    </div>
  </div>
</div>

<div class="container">

  <!-- ── 顶部筛选区 ── -->
  <div class="section">
    <div class="section-title">筛选条件（影响看板展示）</div>
    <div class="filter-row">
      <div class="filter-group">
        <label>开始日期（UTC+0）</label>
        <input type="date" id="filter-start" />
      </div>
      <div class="filter-group">
        <label>结束日期（UTC+0）</label>
        <input type="date" id="filter-end" />
      </div>
      <div class="filter-group">
        <label>快捷选择</label>
        <div class="quick-btns">
          <button class="quick-btn" onclick="setQuick(1)">昨天</button>
          <button class="quick-btn" onclick="setQuick(3)">近3天</button>
          <button class="quick-btn active" onclick="setQuick(7)">近7天</button>
          <button class="quick-btn" onclick="setQuick(15)">近15天</button>
        </div>
      </div>
      <div class="filter-group" style="flex: 2;">
        <label>APPID（输入框，多个用逗号分隔）</label>
        <input type="text" id="appid-input" placeholder="例如: 1436799971,com.binance.dev" style="width: 100%;" />
        <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">
          当前支持: <span id="available-appids-list">1436799971, com.binance.dev</span>
        </div>
      </div>
      <div class="filter-group" style="justify-content:flex-end">
        <button class="btn btn-primary" onclick="loadAllPanels()">刷新看板</button>
      </div>
    </div>
  </div>

  <!-- ── 拉取触发区 ── -->
  <div class="section">
    <div class="section-title">触发数据拉取</div>
    <div class="pull-row">
      <div class="filter-group">
        <label>APPID（多个用英文逗号分隔）</label>
        <input type="text" id="pull-appids" class="pull-input" placeholder="com.app1, com.app2" />
      </div>
      <div class="filter-group">
        <label>开始日期</label>
        <input type="date" id="pull-start" />
      </div>
      <div class="filter-group">
        <label>结束日期</label>
        <input type="date" id="pull-end" />
      </div>
      <div class="filter-group">
        <label>快捷</label>
        <div class="quick-btns">
          <button class="quick-btn" onclick="setPullQuick(3)">近3天</button>
          <button class="quick-btn active" onclick="setPullQuick(7)">近7天</button>
          <button class="quick-btn" onclick="setPullQuick(15)">近15天</button>
        </div>
      </div>
      <div class="filter-group" style="justify-content:flex-end">
        <div class="checkbox-wrap" style="margin-bottom:8px">
          <input type="checkbox" id="scheduled-check" />
          <label for="scheduled-check">定期拉取（每日 UTC+0 02:00 自动拉取昨日数据）</label>
        </div>
        <button class="btn btn-primary" id="pull-btn" onclick="triggerPull()">开始拉取</button>
      </div>
    </div>
    <div class="status-bar" id="pull-status"></div>
  </div>

  <!-- ── 看板区 ── -->
  <div id="panels">

    <!-- 看板1：综合数据 -->
    <div class="section">
      <div class="section-title">综合数据看板（维度：APPID / prod）</div>
      <div class="table-wrap" id="panel-overview"></div>
    </div>

    <!-- 看板2：PRT / PID / PRT+PID -->
    <div class="section">
      <div class="section-title">渠道维度看板</div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab('prt', this)">PRT</div>
        <div class="tab" onclick="switchTab('pid', this)">PID</div>
        <div class="tab" onclick="switchTab('prt_pid', this)">PRT + PID</div>
      </div>
      <div class="table-wrap" id="panel-prt"></div>
      <div class="table-wrap" id="panel-pid" style="display:none"></div>
      <div class="table-wrap" id="panel-prt_pid" style="display:none"></div>
    </div>

    <!-- 看板3：Affiliate -->
    <div class="section">
      <div class="section-title">Affiliate 表现看板</div>
      <div class="table-wrap" id="panel-affiliate"></div>
    </div>

    <!-- 看板4：GEOs -->
    <div class="section">
      <div class="section-title">GEOs 表现看板</div>
      <div class="table-wrap" id="panel-geo"></div>
    </div>

    <!-- 看板5：AM -->
    <div class="section">
      <div class="section-title">AM 表现看板</div>
      <div class="table-wrap" id="panel-am"></div>
    </div>

  </div>
</div>

<script>
// ── 配置 ──────────────────────────────────────────────────────────────────────
// API_BASE 优先从 URL 参数读取，其次从 localStorage 读取，最后回退到 localhost
// 示例: index.html?api=https://xxxx.ngrok-free.app
const urlParams = new URLSearchParams(window.location.search);
const savedBase = localStorage.getItem('appid_api_base');
let API_BASE = urlParams.get('api') || savedBase || 'http://localhost:5050';
if (urlParams.get('api')) {
  localStorage.setItem('appid_api_base', API_BASE);
  // 清除 URL 参数，保持地址干净
  const cleanUrl = window.location.pathname;
  window.history.replaceState({}, '', cleanUrl);
}

// ── 日期工具 ──────────────────────────────────────────────────────────────────
function utcDateStr(offsetDays = 0) {
  const d = new Date();
  d.setUTCDate(d.getUTCDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function setQuick(days) {
  document.querySelectorAll('.filter-row .quick-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const end = utcDateStr(-1);
  const start = utcDateStr(-(days));
  document.getElementById('filter-start').value = start;
  document.getElementById('filter-end').value = end;
}

function setPullQuick(days) {
  document.querySelectorAll('.pull-row .quick-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const end = utcDateStr(-1);
  const start = utcDateStr(-(days));
  document.getElementById('pull-start').value = start;
  document.getElementById('pull-end').value = end;
}

// ── 初始化默认日期 ────────────────────────────────────────────────────────────
(function initDates() {
  const end = utcDateStr(-1);
  const start = utcDateStr(-7);
  document.getElementById('filter-start').value = start;
  document.getElementById('filter-end').value = end;
  document.getElementById('pull-start').value = start;
  document.getElementById('pull-end').value = end;
})();

// ── APPID 管理 ────────────────────────────────────────────────────────────────
let availableAppids = ['1436799971', 'com.binance.dev'];

// 页面加载时更新可用APPID列表显示
function updateAvailableAppidsDisplay() {
  const displayElement = document.getElementById('available-appids-list');
  if (displayElement) {
    displayElement.textContent = availableAppids.join(', ');
  }
}

// 初始化
updateAvailableAppidsDisplay();

// ── 表格渲染 ──────────────────────────────────────────────────────────────────
const PANEL_COLS = {
  overview:  { dim: 'prod',           label: 'APPID (prod)' },
  prt:       { dim: 'prt',            label: 'PRT' },
  pid:       { dim: 'pid',            label: 'PID' },
  prt_pid:   { dim: 'prt_pid',        label: 'PRT + PID' },
  affiliate: { dim: 'affiliate_id',   label: 'Affiliate ID' },
  geo:       { dim: 'country',        label: 'Country' },
  am:        { dim: 'source_manager', label: 'AM' },
};

function fmt(v, type='num') {
  if (v === null || v === undefined) return '<span class="dash">—</span>';
  if (type === 'rate') return `<span class="rate-cell">${v}%</span>`;
  if (type === 'revenue') return `<span class="revenue-cell">$${Number(v).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>`;
  if (type === 'reject') return `<span class="reject-cell">${Number(v).toLocaleString()}</span>`;
  return Number(v).toLocaleString();
}

function renderTable(containerId, panel, rows) {
  const cfg = PANEL_COLS[panel];
  const hasAffiliateName = panel === 'affiliate';
  const headers = [
    cfg.label,
    'Total Clicks', 'TS Total Clicks', 'Task Rate',
    'TS Success Clicks', 'Success Rate',
    'Installs', 'CR',
    'Events', 'ER',
    'Revenue',
    'Rejected Installs', 'Fraud Rate',
  ];
  if (hasAffiliateName) headers.splice(1, 0, 'Affiliate Name');

  const thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;

  if (!rows || rows.length === 0) {
    document.getElementById(containerId).innerHTML =
      `<table>${thead}<tbody><tr class="loading-row"><td colspan="${headers.length}">暂无数据</td></tr></tbody></table>`;
    return;
  }

  const tbody = rows.map(r => {
    const dimVal = r[cfg.dim] || '—';
    let cells = [
      `<td title="${dimVal}">${dimVal}</td>`,
    ];
    if (hasAffiliateName) cells.push(`<td>${r.source_name || ''}</td>`);
    cells = cells.concat([
      `<td>${fmt(r.total_clicks)}</td>`,
      `<td>${fmt(r.ts_total_clicks)}</td>`,
      `<td>${fmt(r.task_rate, 'rate')}</td>`,
      `<td>${fmt(r.ts_success_clicks)}</td>`,
      `<td>${fmt(r.success_rate, 'rate')}</td>`,
      `<td>${fmt(r.installs)}</td>`,
      `<td>${fmt(r.cr, 'rate')}</td>`,
      `<td>${fmt(r.events)}</td>`,
      `<td>${fmt(r.er, 'rate')}</td>`,
      `<td>${fmt(r.revenue, 'revenue')}</td>`,
      `<td>${fmt(r.rejected_installs, 'reject')}</td>`,
      `<td>${fmt(r.fraud_rate, 'rate')}</td>`,
    ]);
    return `<tr>${cells.join('')}</tr>`;
  }).join('');

  document.getElementById(containerId).innerHTML =
    `<table>${thead}<tbody>${tbody}</tbody></table>`;
}

function showLoading(containerId, panel) {
  const cfg = PANEL_COLS[panel];
  document.getElementById(containerId).innerHTML = `
    <table>
      <thead><tr><th>${cfg.label}</th><th colspan="12">...</th></tr></thead>
      <tbody><tr class="loading-row"><td colspan="13"><span class="spinner"></span>加载中...</td></tr></tbody>
    </table>`;
}

// ── 加载看板数据 ──────────────────────────────────────────────────────────────
async function loadPanel(panel, containerId) {
  showLoading(containerId, panel);
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  const appidInput = document.getElementById('appid-input').value.trim();
  
  // 如果输入框为空，使用所有可用APPID
  const appids = appidInput || availableAppids.join(',');

  try {
    const url = `${API_BASE}/api/dashboard?panel=${panel}&start_date=${start}&end_date=${end}&appids=${encodeURIComponent(appids)}`;
    const res = await fetch(url);
    const data = await res.json();
    renderTable(containerId, panel, data.data || []);
  } catch(e) {
    document.getElementById(containerId).innerHTML =
      `<div style="color:var(--danger);padding:20px">加载失败: ${e.message}<br>请确认后端服务已启动（python3 backend/app.py）</div>`;
  }
}

async function loadAllPanels() {
  // APPID已硬编码，无需从API加载
  const panels = [
    ['overview', 'panel-overview'],
    ['prt', 'panel-prt'],
    ['pid', 'panel-pid'],
    ['prt_pid', 'panel-prt_pid'],
    ['affiliate', 'panel-affiliate'],
    ['geo', 'panel-geo'],
    ['am', 'panel-am'],
  ];
  for (const [panel, id] of panels) {
    await loadPanel(panel, id);
  }
  document.getElementById('last-update').textContent = '最后更新: ' + new Date().toLocaleTimeString();
}

// ── Tab 切换 ──────────────────────────────────────────────────────────────────
function switchTab(panel, el) {
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['prt', 'pid', 'prt_pid'].forEach(p => {
    document.getElementById(`panel-${p}`).style.display = p === panel ? '' : 'none';
  });
}

// ── 触发拉取 ──────────────────────────────────────────────────────────────────
async function triggerPull() {
  const appids = document.getElementById('pull-appids').value.trim();
  const start = document.getElementById('pull-start').value;
  const end = document.getElementById('pull-end').value;
  const scheduled = document.getElementById('scheduled-check').checked;

  if (!appids) { showStatus('error', 'APPID 不能为空'); return; }
  if (!start || !end) { showStatus('error', '请选择时间范围'); return; }

  const btn = document.getElementById('pull-btn');
  btn.disabled = true;
  showStatus('running', '<span class="spinner"></span>任务已提交，正在拉取数据...');

  try {
    const res = await fetch(`${API_BASE}/api/pull`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appids, start_date: start, end_date: end, scheduled }),
    });
    const data = await res.json();
    if (data.success) {
      showStatus('running', `<span class="spinner"></span>任务运行中，完成后将通知飞书群...`);
      pollJobStatus();
    } else {
      showStatus('error', '提交失败: ' + data.message);
      btn.disabled = false;
    }
  } catch(e) {
    showStatus('error', '请求失败: ' + e.message + '（请确认后端已启动）');
    btn.disabled = false;
  }
}

function showStatus(type, msg) {
  const bar = document.getElementById('pull-status');
  bar.className = 'status-bar ' + type;
  bar.innerHTML = msg;
}

async function pollJobStatus() {
  const btn = document.getElementById('pull-btn');
  const timer = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/job/status`);
      const data = await res.json();
      if (!data.running) {
        clearInterval(timer);
        btn.disabled = false;
        const r = data.last_result;
        if (r && r.success) {
          showStatus('success', `✅ 拉取成功！Common: ${r.counts?.common || 0} 条，Block: ${r.counts?.block || 0} 条，TrackSrc: ${r.counts?.tracksrc || 0} 条`);
          loadAllPanels();
        } else {
          showStatus('error', '❌ 拉取失败: ' + (r?.message || '未知错误'));
        }
      }
    } catch(e) { /* 忽略轮询错误 */ }
  }, 3000);
}

// ── API 地址配置弹窗 ────────────────────────────────────────────────────────────────────────
function showApiConfig() {
  document.getElementById('api-base-input').value = API_BASE;
  const modal = document.getElementById('api-modal');
  modal.style.display = 'flex';
}
function closeApiConfig() {
  document.getElementById('api-modal').style.display = 'none';
}
function saveApiConfig() {
  const val = document.getElementById('api-base-input').value.trim().replace(/\/$/, '');
  if (!val) return;
  API_BASE = val;
  localStorage.setItem('appid_api_base', val);
  closeApiConfig();
  loadAllPanels();
}

// ── 初始化 ──────────────────────────────────────────────────────────────────────────────
// 页面加载完成后立即加载数据
loadAllPanels();
</script>
</body>
</html>
