function fmt(n) { return typeof n === 'number' ? n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : (n || '--'); }
function fmtInt(n) { return typeof n === 'number' ? n.toLocaleString('en-US') : (n || '--'); }

function card(cls, accentColor) {
  var e = document.createElement('div');
  e.className = 'card' + (cls ? ' ' + cls : '');
  if (accentColor) e.style.setProperty('--card-accent', accentColor);
  return e;
}

function section(label) {
  var e = document.createElement('div');
  e.className = 'section';
  e.innerHTML = '<div class="section-line"></div><div class="section-label">' + label + '</div><div class="section-line"></div>';
  return e;
}

function renderAll() {
  var g = document.getElementById('grid');
  g.innerHTML = '';

  // Header meta
  var m = REPORT.report_title.match(/(morning|afternoon|evening)/i);
  document.getElementById('reportBadge').textContent = m ? m[0].toUpperCase() : 'REPORT';
  document.getElementById('reportMeta').textContent = '生成时间：' + REPORT.report_time_beijing + '（北京时间）  |  Yesterday: ' + REPORT.yesterday + '  DayBefore: ' + REPORT.day_before;
  document.getElementById('statusDetail').textContent = '最后更新：' + (REPORT.last_update_beijing || '--') + '  ·  本次采集新增 ' + (REPORT.inserted_count || 0) + ' 条';

  var cards = {};
  REPORT.cards.forEach(function(c) { cards[c.id] = c; });

  // ── Section A: 收入巡检 ──────────────────────────────────────────────
  g.appendChild(section('A · 收入巡检 (Revenue)'));

  // Card 1: Revenue by Date
  var c1 = cards['revenue_by_date'];
  if (c1) {
    var e1 = card('card-wide', '#58a6ff');
    var isPos1 = c1.is_positive;
    e1.innerHTML = '<div class="card-icon">💰</div><div class="card-title">' + c1.title + '</div>' +
      '<div class="compare-grid">' +
        '<div class="compare-item"><label>Yesterday (' + REPORT.yesterday + ')</label><div class="val" style="color:var(--accent)">' + c1.yesterday + '</div></div>' +
        '<div class="compare-item"><label>DayBefore (' + REPORT.day_before + ')</label><div class="val">' + c1.day_before + '</div></div>' +
      '</div>' +
      '<div class="diff-row"><span class="diff-val ' + (isPos1?'pos':'neg') + '">' + c1.diff + '</span><span class="diff-pct">' + c1.diff_pct + '</span></div>';
    g.appendChild(e1);
  }

  // Card 2: Revenue Trends (line chart)
  var c2 = cards['recent_revenue_trends'];
