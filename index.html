    var e12 = card('card-full', '#d2a8ff');
    var mkRow12 = function(r) {
      var _p = r.prod || '--';
      var _n = r.app_name || '';
      var _lbl = (_n && _n !== _p) ? (_p + ' (' + (_n.length > 20 ? _n.substring(0,18)+'..' : _n) + ')') : _p;
      var sign = r.is_positive ? 'tag-pos' : 'tag-neg';
      return '<tr><td title="' + (_n||_p) + '">' + _lbl + '</td><td>$' + fmt(r.today) + '</td><td>$' + fmt(r.yesterday_same) + '</td><td class="' + sign + '">' + (r.is_positive?'+':'') + '$' + fmt(r.diff) + '</td><td class="' + sign + '">' + (r.is_positive?'+':'') + r.diff_pct + '%</td></tr>';
    };
    e12.innerHTML = '<div class="card-title">' + c12.title + '</div>' +
      '<div class="double-table">' +
        '<div><div class="sub-table-title" style="color:var(--green)">🔺 今日收入增长 Top</div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>APP</th><th>Today</th><th>Yesterday Same</th><th>差额</th><th>增幅</th></tr></thead><tbody>' +
        (c12.increase || []).map(mkRow12).join('') +
        '</tbody></table></div></div>' +
        '<div><div class="sub-table-title" style="color:var(--red)">🔻 今日收入下降 Top</div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>APP</th><th>Today</th><th>Yesterday Same</th><th>差额</th><th>降幅</th></tr></thead><tbody>' +
        (c12.decrease || []).map(mkRow12).join('') +
        '</tbody></table></div></div>' +
      '</div>';
    g.appendChild(e12);
  }

  // ── Charts ──────────────────────────────────────────────────────────
  requestAnimationFrame(function() {
    // Trend Line Chart
    if (c2 && document.getElementById('trendChart')) {
      new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels: c2.data.labels,
          datasets: [{
            label: '收入 (USD)',
            data: c2.data.datasets[0].data,
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88,166,255,0.10)',
            borderWidth: 2,
            pointBackgroundColor: '#58a6ff',
            pointRadius: 3,
            tension: 0.35,
            fill: true
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#21262d', borderColor: '#30363d', borderWidth: 1,
              titleColor: '#8b949e', bodyColor: '#e6edf3',
              callbacks: { label: function(ctx) { return ' $' + ctx.parsed.y.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); } }
            }
          },
          scales: {
            x: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 } },
            y: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 10 }, callback: function(v) { return '$' + v.toLocaleString(); } } }
          }
        }
      });
    }
  });
}

renderAll();
</script>
</body>
</html>
